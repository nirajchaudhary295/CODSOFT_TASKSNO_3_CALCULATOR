<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator-container">

        <div class="calculator">

            <!-- Calculator Header -->
            <div class="calculator-header">
                <h1>Calculator</h1>
                <p>Simple • Fast • Accurate</p>
            </div>

            <!-- Display -->
            <div class="display-container">
                <div id="previous-display" class="previous-display"></div>
                <div id="current-display" class="current-display">0</div>
            </div>

            <!-- Calculator Buttons -->
            <div class="buttons">

                <button class="button function" data-action="clear">
                    AC
                </button>

                <button class="button function" data-action="delete">
                    DEL
                </button>

                <button class="button operator" data-operation="%">
                    %
                </button>

                <button class="button operator" data-operation="÷">
                    ÷
                </button>


                <button class="button number" data-number="7">
                    7
                </button>

                <button class="button number" data-number="8">
                    8
                </button>

                <button class="button number" data-number="9">
                    9
                </button>

                <button class="button operator" data-operation="×">
                    ×
                </button>


                <button class="button number" data-number="4">
                    4
                </button>

                <button class="button number" data-number="5">
                    5
                </button>

                <button class="button number" data-number="6">
                    6
                </button>

                <button class="button operator" data-operation="-">
                    −
                </button>


                <button class="button number" data-number="1">
                    1
                </button>

                <button class="button number" data-number="2">
                    2
                </button>

                <button class="button number" data-number="3">
                    3
                </button>

                <button class="button operator" data-operation="+">
                    +
                </button>


                <button class="button number zero" data-number="0">
                    0
                </button>

                <button class="button number" data-number=".">
                    .
                </button>

                <button class="button equals" data-action="calculate">
                    =
                </button>

            </div>

            <!-- Footer -->
            <div class="calculator-footer">
                <p>HTML • CSS • JavaScript</p>
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
